[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-vdot-optimizer"
version = "0.1.0"
description = "Optimize relay time allocation from runner VDOT values."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Codex" }]
license = { text = "MIT" }

[project.scripts]
relay-vdot = "relay_vdot_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
